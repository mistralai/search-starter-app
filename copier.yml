_min_copier_version: "9.0.0"
_subdirectory: "template"

_tasks:
  - command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/scripts/populate_api_key.py"
    when: "{{ _copier_operation == 'copy' }}"

project_name:
  type: str
  default: "my-search"
  help: "Project name"

mistral_api_key:
  type: str
  secret: true
  default: ""
  when: false

collection_name:
  type: str
  default: "exampledocs"
  help: "Vespa collection name (must match the schema migration)"
