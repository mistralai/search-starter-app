_min_copier_version: "9.0.0"
_subdirectory: "template"

project_name:
  type: str
  default: "my-search"
  help: "Project name"

mistral_api_key:
  type: str
  secret: true
  default: "{{ environ.get('MISTRAL_API_KEY', '') }}"
  help: "Mistral API key"

collection_name:
  type: str
  default: "exampledocs"
  help: "Vespa collection name (must match the schema migration)"
